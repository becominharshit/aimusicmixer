[project]
name = "mixbench-backend"
version = "1.0.0"
description = "Deterministic Python DSP & privacy-first AI mentoring backend for MixBench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "google-genai>=2.30.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
