name: MixBench CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v5
      - name: Install Python dependencies
        run: uv sync
      - name: Generate test audio suite
        run: uv run python scripts/generate_test_audio.py
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Pytest suite
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest unit tests
        run: npm run test
      - name: Next.js production build (no Supabase env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
        run: npm run build
      - name: Next.js production build (mock Supabase env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.sig"
        run: npm run build

  playwright-visual-qa:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build production app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
        run: npm run build
      - name: Run Playwright visual & layout QA suite (1440x900 & 390x844)
        run: |
          npm run start &
          SERVER_PID=$!
          npx wait-on http://127.0.0.1:3000 --timeout 30000 || sleep 5
          npx playwright test tests/e2e/visual-qa.spec.ts --reporter=list
          TEST_EXIT=$?
          kill $SERVER_PID || true
          exit $TEST_EXIT
      - name: Upload Playwright failure screenshots & traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-qa-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7


