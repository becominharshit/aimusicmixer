<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MixBench — Architecture &amp; Signal Flow Banner (1500×500)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F5F5F7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
    }
    .banner {
      width: 1500px;
      height: 500px;
      background: #FAFAFA;
      border: 1px solid rgba(24, 34, 32, 0.08);
      border-radius: 20px;
      padding: 44px 64px;
      display: grid;
      grid-template-columns: 1.05fr 1.25fr;
      gap: 36px;
      align-items: center;
    }
    .title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #182220;
      line-height: 1.1;
    }
    .sub {
      margin-top: 14px;
      font-size: 18px;
      color: #52605D;
      line-height: 1.5;
      max-width: 44ch;
    }
    .badges {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: #EBF3F1;
      color: #3A7269;
      border: 1px solid rgba(58, 114, 105, 0.22);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .flow-box {
      background: #FFFFFF;
      border: 1px solid rgba(24, 34, 32, 0.08);
      border-radius: 20px;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div>
      <h1 class="title">MixBench Hybrid Audio &amp; DSP Architecture</h1>
      <p class="sub">
        Learn mixing and mastering by doing mixing and mastering—powered by Web Audio translation,
        deterministic 4× True Peak Python DSP, and evidence-bound Gemini mentoring.
      </p>
      <div class="badges">
        <span class="badge">ITU-R BS.1770 LUFS</span>
        <span class="badge">4× Polyphase dBTP</span>
        <span class="badge">Zero AI Stem Separation</span>
        <span class="badge">3-Tier Consent</span>
      </div>
    </div>
    <div class="flow-box">
      <svg viewBox="0 0 720 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="20" width="310" height="300" rx="16" fill="#F5F5F7" stroke="rgba(24,34,32,0.12)" />
        <text x="36" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#182220">Browser Web Audio Studio</text>
        <rect x="36" y="74" width="270" height="54" rx="10" fill="#FFFFFF" stroke="rgba(24,34,32,0.08)" />
        <text x="50" y="98" font-size="13" font-weight="600" fill="#182220">60fps Canvas + Issue Pins</text>
        <text x="50" y="116" font-size="11" fill="#52605D">Zero React re-renders via rAF</text>
        <rect x="36" y="142" width="270" height="54" rx="10" fill="#FFFFFF" stroke="rgba(24,34,32,0.08)" />
        <text x="50" y="166" font-size="13" font-weight="600" fill="#182220">15ms Ramps + Mono (0.5L+0.5R)</text>
        <text x="50" y="184" font-size="11" fill="#52605D">LUFS-matched A/B reference deck</text>
        <rect x="36" y="210" width="270" height="54" rx="10" fill="#EBF3F1" stroke="rgba(58,114,105,0.28)" />
        <text x="50" y="234" font-size="13" font-weight="600" fill="#182220">Device Translation Lab</text>
        <text x="50" y="252" font-size="11" fill="#3A7269">Smartphone / Laptop BiquadFilterNode</text>

        <path d="M332 170 L388 170" stroke="#3A7269" stroke-width="2.5" marker-end="url(#arrow)" />
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3A7269" />
          </marker>
        </defs>

        <rect x="394" y="20" width="310" height="300" rx="16" fill="#F5F5F7" stroke="rgba(24,34,32,0.12)" />
        <text x="414" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#182220">FastAPI Python DSP Engine</text>
        <rect x="414" y="74" width="270" height="54" rx="10" fill="#FFFFFF" stroke="rgba(24,34,32,0.08)" />
        <text x="428" y="98" font-size="13" font-weight="600" fill="#182220">pyloudnorm + 4× resample_poly</text>
        <text x="428" y="116" font-size="11" fill="#52605D">FFmpeg ebur128 + 44.1k browser proxy</text>
        <rect x="414" y="142" width="270" height="54" rx="10" fill="#FFFFFF" stroke="rgba(24,34,32,0.08)" />
        <text x="428" y="166" font-size="13" font-weight="600" fill="#182220">Welch PSD + Mid/Side + Stems</text>
        <text x="428" y="184" font-size="11" fill="#52605D">50 ms alignment + pairwise overlap</text>
        <rect x="414" y="210" width="270" height="54" rx="10" fill="#FFFFFF" stroke="rgba(24,34,32,0.08)" />
        <text x="428" y="234" font-size="13" font-weight="600" fill="#182220">Opt-In Gemini Mentor + Fallback</text>
        <text x="428" y="252" font-size="11" fill="#52605D">Cites verified evidence_id tokens only</text>
      </svg>
    </div>
  </div>
</body>
</html>
